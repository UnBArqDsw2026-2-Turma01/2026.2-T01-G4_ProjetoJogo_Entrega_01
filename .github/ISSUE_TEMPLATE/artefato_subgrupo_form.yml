name: Artefato de subequipe
description: Planejar e acompanhar um artefato, relatório ou iniciativa de uma subequipe
title: "[SubEquipe_XX] "
labels: ["entrega-01"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use uma issue por artefato ou unidade de trabalho. Substitua `XX` no título e adicione as labels da subequipe e do foco correspondentes.
        Estruture a tarefa para que decisões, evidências, commits e pull requests possam ser rastreados até o artefato entregue.

  - type: dropdown
    id: subequipe
    attributes:
      label: Subequipe
      options:
        - SubEquipe_01
        - SubEquipe_02
        - SubEquipe_03
    validations:
      required: true

  - type: dropdown
    id: foco
    attributes:
      label: Foco ou categoria
      options:
        - "FOCO_01: Artefato generalista ou NFR Framework"
        - "FOCO_02: Engenharia Reversa ou BPMN"
        - "FOCO_03: IA Generativa"
        - Iniciativa extra
        - Outro
    validations:
      required: true

  - type: dropdown
    id: artefato
    attributes:
      label: Artefato principal
      options:
        - Rich Picture
        - Mapa Mental
        - NFR Framework e SIG
        - Engenharia Reversa e BPMN
        - Ponto de vista sobre IA Generativa
        - Iniciativa extra
        - Outro
    validations:
      required: true

  - type: input
    id: responsaveis
    attributes:
      label: Responsáveis
      description: Informe os usuários do GitHub responsáveis pela atividade.
      placeholder: "@usuario1, @usuario2"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Explique a necessidade da atividade, o estado atual e sua relação com a entrega.
      placeholder: |
        A entrega exige...
        Atualmente o artefato...
        Esta atividade é necessária porque...
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo e resultado esperado
      description: Descreva o resultado verificável que deve existir ao concluir a issue.
    validations:
      required: true

  - type: textarea
    id: arquivos
    attributes:
      label: Arquivos e páginas envolvidos
      description: Liste caminhos do repositório e links relevantes.
      placeholder: |
        - docs/Base/Relatórios/SubEquipe_XX/Artefato.md
        - docs/_sidebar.md
    validations:
      required: true

  - type: textarea
    id: tarefas
    attributes:
      label: Tarefas
      description: Crie uma lista de etapas objetivas e mantenha os itens atualizados.
      placeholder: |
        - [ ] Produzir ou revisar o artefato
        - [ ] Preservar evidências e arquivos-fonte
        - [ ] Documentar metodologia e decisões
        - [ ] Publicar e validar no Docsify
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidências, ferramentas e referências
      description: Registre gravações, capturas, dados, ferramentas, literatura ou outras fontes previstas.
    validations:
      required: false

  - type: textarea
    id: rastreabilidade
    attributes:
      label: Rastreabilidade e dependências
      description: Relacione atas, decisões, issues, artefatos anteriores e dependências desta atividade.
      placeholder: |
        - Decisão ou ata de origem:
        - Artefatos relacionados:
        - Issues dependentes ou relacionadas:
        - Ordem de execução, quando relevante:
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      description: Defina condições objetivas para considerar o trabalho aceito.
      placeholder: |
        - [ ] O artefato atende à notação ou técnica escolhida
        - [ ] A metodologia justifica as decisões tomadas
        - [ ] As evidências e referências são acessíveis
        - [ ] A página renderiza corretamente no Docsify
    validations:
      required: true

  - type: checkboxes
    id: definicao-pronto
    attributes:
      label: Definição de pronto
      description: Atualize estes itens ao longo da atividade.
      options:
        - label: Alterações limitadas ao escopo da issue
        - label: Página sem campos vazios ou textos de exemplo
        - label: Figuras e tabelas com legenda e fonte adequada
        - label: Arquivos de evidência e arquivos-fonte preservados
        - label: Links internos e mídias testados no Docsify
        - label: Histórico de versão atualizado somente com responsáveis humanos
        - label: Índices e docs/_sidebar.md atualizados quando aplicável
        - label: Contribuição de cada responsável comprovada por commits
        - label: Contribuições registradas em docs/Base/1.2.ParticipacoesBase.md
        - label: Pull request relacionado à issue e revisado

  - type: checkboxes
    id: conduta
    attributes:
      label: Código de Conduta
      options:
        - label: Li e concordo em seguir o [Código de Conduta](https://github.com/UnBArqDsw2026-2-Turma01/2026.2-T01-_G4_ProjetoJogo_Entrega_01/blob/main/CODE_OF_CONDUCT.md)
          required: true
