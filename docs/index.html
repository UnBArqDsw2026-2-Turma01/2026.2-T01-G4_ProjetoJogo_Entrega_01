<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>G4 - Projeto Jogo</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação do Grupo 04 - FGA0208">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">

  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark-theme');
    })();
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --sidebar-bg: #fafbfc;
      --text: #34495e;
      --muted: #6b7a8c;
      --sidebar-text: #4a5768;
      --accent: #42b983;
      --border: rgba(0,0,0,.08);
      --hover-bg: rgba(66,185,131,.08);
      --code-bg: #f6f8fa;
      --code-text: #476582;
    }
    html.dark-theme {
      --bg: #0f1419;
      --sidebar-bg: #151b23;
      --text: #dfe4ea;
      --muted: #8b96a5;
      --sidebar-text: #b9c2cd;
      --accent: #58d6a0;
      --border: #232c38;
      --hover-bg: rgba(88,214,160,.10);
      --code-bg: #1a222c;
      --code-text: #c8d3e0;
    }

    /* ---------- content ---------- */
    body { background-color: var(--bg); color: var(--text); }
    .content { background-color: var(--bg); }
    .markdown-section { color: var(--text); }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong { color: var(--text); }
    .markdown-section h2 { border-bottom: 1px solid var(--border); padding-bottom: .4em; }
    .markdown-section a { color: var(--accent); }
    .markdown-section blockquote {
      border-left: 4px solid var(--accent);
      background: var(--hover-bg);
      color: var(--muted);
      padding: .6em 1em;
      border-radius: 0 6px 6px 0;
    }
    .markdown-section blockquote p { color: var(--muted); }
    .markdown-section code,
    .markdown-section pre { background-color: var(--code-bg); color: var(--code-text); }
    .markdown-section pre > code { background-color: transparent; color: var(--code-text); }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section table th { background-color: var(--sidebar-bg); color: var(--text); }
    .markdown-section table tr { background-color: var(--bg); border-top: 1px solid var(--border); }
    .markdown-section table tr:nth-child(2n) { background-color: var(--sidebar-bg); }
    .markdown-section table td,
    .markdown-section table th { border-color: var(--border); }
    .markdown-section hr { border-color: var(--border); }

    /* ---------- sidebar ---------- */
    .sidebar {
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding-top: 30px;
    }
    .sidebar > h1 { margin-bottom: 1.2rem; }
    .sidebar > h1 a { color: var(--text); font-weight: 600; }
    .sidebar-toggle { background-color: var(--sidebar-bg); }
    .sidebar-toggle span { background-color: var(--accent); }
    .sidebar .sidebar-nav { padding: 0 15px 40px 22px; line-height: 1.6em; }
    .sidebar ul { margin: 0; padding: 0; }

    .sidebar ul li a,
    .sidebar ul li > p {
      color: var(--sidebar-text);
      display: block;
      margin: 1px 0;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      transition: background .15s, color .15s;
    }
    .sidebar ul li a:hover,
    .sidebar ul li > p:hover { background: var(--hover-bg); color: var(--accent); text-decoration: none; }
    .sidebar ul li.active > a {
      background: var(--hover-bg);
      color: var(--accent);
      font-weight: 600;
      border-right: none;
    }
    /* group headers = li that is not a leaf file */
    .sidebar-nav li:not(.file) > p,
    .sidebar-nav li:not(.file) > a { font-weight: 600; color: var(--text); }
    /* nested levels */
    .sidebar ul li ul { padding-left: 16px; margin-left: 6px; border-left: 1px solid var(--border); }

    /* caret colors (plugin draws the chevron via ::before) */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file)::before {
      border-right-color: var(--muted);
      border-bottom-color: var(--muted);
    }
    .sidebar-nav ul:not(.app-sub-sidebar) > li.open::before {
      border-right-color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ---------- theme toggle ---------- */
    #theme-toggle {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 50;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--sidebar-bg);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #theme-toggle:hover { background: var(--hover-bg); }
  </style>
</head>
<body>
  <button id="theme-toggle" title="Alternar tema claro/escuro">🌙</button>
  <div id="app"></div>

  <script>
    window.$docsify = {
      loadSidebar: true,
      name: 'G4 - Projeto Jogo',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma01/2026.2-T01-_G4_ProjetoJogo_Entrega_01',
      auto2top: true,
      relativePath: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 0,
      sidebarDisplayLevel: 1
    };

    (function () {
      var btn = document.getElementById('theme-toggle');
      function sync() {
        btn.textContent = document.documentElement.classList.contains('dark-theme') ? '☀️' : '🌙';
      }
      sync();
      btn.addEventListener('click', function () {
        document.documentElement.classList.toggle('dark-theme');
        localStorage.setItem('theme',
          document.documentElement.classList.contains('dark-theme') ? 'dark' : 'light');
        sync();
      });
    })();
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
